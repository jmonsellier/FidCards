name: CI

on:
  push:
    branches: [main]
  pull_request:

# Les PR de forks ne reçoivent qu'un jeton en lecture seule.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Tests JVM (dont le round-trip code-barres, §14), lint, et build release
      # minifié — les tests instrumentés restent locaux (émulateur requis).
      - run: ./gradlew test :app:lintDebug assembleRelease
